[project]
name = "humancompiler-scheduler"
version = "0.3.1"
description = "HumanCompiler-oriented scheduling models, fixtures, and planning solvers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Masato Fukushima" },
]
maintainers = [
  { name = "Masato Fukushima" },
]
requires-python = ">=3.10, <3.15"
keywords = ["humancompiler", "scheduler", "planning", "optimization"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/masa10-f/Scheduler"
Repository = "https://github.com/masa10-f/Scheduler"
Issues = "https://github.com/masa10-f/Scheduler/issues"
Changelog = "https://github.com/masa10-f/Scheduler/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "mypy==2.3.1",
  "pre-commit==4.6.2",
  "pyright==1.1.411",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.4",
]

[project.optional-dependencies]
cp-sat = ["ortools>=9.6"]
docs = ["sphinx>=7.0"]

[build-system]
requires = ["hatchling>=1.30.1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["humancompiler_scheduler"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
  # Conflicts with ruff format
  "missing-trailing-comma",
  "prohibited-trailing-comma",
  "docstring-tab-indentation",
  "triple-single-quotes",
  "indentation-with-invalid-multiple",
  "indentation-with-invalid-multiple-comment",
  "over-indented",
  "single-line-implicit-string-concatenation",
  "multi-line-implicit-string-concatenation",
  "bad-quotes-inline-string",
  "bad-quotes-multiline-string",
  "bad-quotes-docstring",
  "avoidable-escaped-quote",
  "tab-indentation",

  # Not necessary for this project
  "AIR",
  "ASYNC",
  "DJ",
  "PD",

  # Manually disabled
  "CPY",     # copyright missing
  "undocumented-magic-method",    # undocumented magic method
  "docstring-missing-returns",  # return sections for existing concise docstrings
  "docstring-missing-exception",  # raised exception sections for existing concise docstrings
  "raw-string-in-exception",   # exception message style migration is deferred
  "f-string-in-exception",   # exception message style migration is deferred
  "ERA",     # commented-out code
  "FBT",     # boolean-trap
  "FIX",     # fixme
  "too-many-public-methods", # too-many-public-methods
  "typing-only-first-party-import",   # typing-only app imports add churn for runtime re-export modules
  "typing-only-standard-library-import",   # typing-only stdlib imports add churn for dataclass-heavy modules
  "raise-vanilla-args",  # custom exception classes are not worth the churn here
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.per-file-ignores]
"examples/*.py" = [
  "D",
  "print", # print
]
"humancompiler_scheduler/human/io.py" = [
  "any-type", # YAML payloads are validated at the boundary
  "magic-value-comparison",
]
"humancompiler_scheduler/io.py" = [
  "any-type", # YAML payloads are validated at the boundary
  "magic-value-comparison",
]
"humancompiler_scheduler/human/model.py" = [
  "complex-structure",
  "undocumented-public-method",
  "too-many-branches",
  "magic-value-comparison",
]
"humancompiler_scheduler/human/report.py" = [
  "complex-structure",
  "undocumented-public-module",
  "undocumented-public-function",
  "repeated-append",
  "manual-list-comprehension",
  "too-many-branches",
  "magic-value-comparison",
]
"humancompiler_scheduler/human/review.py" = [
  "undocumented-public-module",
  "undocumented-public-function",
]
"humancompiler_scheduler/human/api.py" = [
  "undocumented-public-module",
]
"humancompiler_scheduler/human/solver.py" = [
  "undocumented-public-module",
  "undocumented-public-function",
  "too-many-arguments",
  "too-many-positional-arguments",
  "non-augmented-assignment",
  "needless-bool",
]
"humancompiler_scheduler/human/weekly.py" = [
  "any-type",
  "complex-structure",
  "import-outside-top-level",
  "manual-list-comprehension",
  "too-many-branches",
  "too-many-locals",
  "too-many-statements",
  "literal-membership",
]
"humancompiler_scheduler/solvers.py" = [
  "any-type", # optional OR-Tools API is imported dynamically
  "complex-structure",
  "too-many-branches",
  "too-many-arguments",
  "too-many-locals",
  "too-many-statements",
  "too-many-positional-arguments",
]
"tests/*.py" = [
  "undocumented-public-module",
  "undocumented-public-class",
  "undocumented-public-method",
  "undocumented-public-function",
  "undocumented-public-package",
  "missing-trailing-period",
  "undocumented-param",
  "static-join-to-f-string",
  "magic-value-comparison",
  "pytest-unittest-assertion",
  "pytest-unittest-raises-assertion",
  "assert",
  "suspicious-subprocess-import",
  "subprocess-without-shell-equals-true",
  "private-member-access",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "cp_sat: tests requiring the optional OR-Tools CP-SAT dependency",
]

[tool.coverage.run]
source = ["humancompiler_scheduler"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = [
  "if TYPE_CHECKING:",
  'raise NotImplementedError\(.*\)',
  "return NotImplemented",
  "@abc.abstractmethod",
]
fail_under = 50

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.html]
directory = "htmlcov"

[tool.mypy]
strict = true
ignore_missing_imports = true
files = ["humancompiler_scheduler", "tests", "examples"]

[tool.pyright]
include = ["humancompiler_scheduler", "tests", "examples"]
reportMissingImports = "information"
reportUnknownArgumentType = "information"
reportUnknownLambdaType = "information"
reportUnknownMemberType = "information"
reportUnknownParameterType = "information"
reportUnknownVariableType = "information"
